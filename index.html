<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Customer Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:800}.subtitle{margin-top:5px;opacity:.9;font-size:14px}.wrap{max-width:700px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 28px rgba(31,41,55,.1);margin-bottom:16px}h1{font-size:21px;margin:0 0 20px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}input,textarea{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff}textarea{min-height:90px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.search{width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px}.status{font-size:13px;margin:12px 0;color:#64748b}.customer{border:1px solid #e2e8f0;border-radius:14px;padding:14px;margin-top:10px}.cname{font-weight:800;font-size:17px}.line{margin-top:5px;color:#475569;font-size:14px}.balance{margin-top:8px;font-weight:800}.empty{text-align:center;padding:25px;color:#64748b}.reload{margin-top:12px;background:#334155;color:#fff;width:100%}</style></head><body><header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Simple business management</div></header><main class="wrap"><section class="card"><h1>Customer Entry</h1><form id="customerForm"><div class="field"><label>Customer Name *</label><input id="name" required placeholder="Enter customer name"></div><div class="field"><label>Mobile Number</label><input id="mobile" type="tel" placeholder="Enter mobile number"></div><div class="field"><label>Address</label><textarea id="address" placeholder="Enter customer address"></textarea></div><div class="field"><label>Opening Balance</label><input id="balance" type="number" min="0" step="0.01" value="0"></div><div class="actions"><button class="save" type="submit">SAVE CUSTOMER</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>One-time Supabase setup</b><div style="font-size:12px;color:#64748b;margin:6px 0">Paste your Supabase Publishable Key below. It is stored only in this browser.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div></section><section class="card"><h1>Customer List</h1><input id="search" class="search" placeholder="Search name or mobile..."><div id="status" class="status">Loading customers...</div><div id="list"></div><button class="reload" type="button" id="reload">REFRESH LIST</button></section></main><script>const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co';const form=document.getElementById('customerForm'),msg=document.getElementById('msg'),list=document.getElementById('list'),status=document.getElementById('status'),search=document.getElementById('search');let customers=[];function show(t,c){msg.textContent=t;msg.className='msg show '+c}function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('setKey').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_')){show('Enter the Supabase Publishable Key.','error');return}localStorage.setItem('bizflow_supabase_key',k);document.getElementById('key').value='';show('Connection key saved on this device.','success');loadCustomers()};form.onsubmit=async e=>{e.preventDefault();const key=localStorage.getItem('bizflow_supabase_key');if(!key){show('First save the Supabase Publishable Key below.','error');return}const name=document.getElementById('name').value.trim();if(!name){show('Please enter customer name.','error');return}const body={name,mobile:document.getElementById('mobile').value.trim(),address:document.getElementById('address').value.trim(),opening_balance:Number(document.getElementById('balance').value||0)};try{const r=await fetch(URL+'/rest/v1/customers',{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key,'Prefer':'return=minimal'},body:JSON.stringify(body)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.hint||'Save failed');show('Customer saved successfully in cloud.','success');form.reset();document.getElementById('balance').value=0;loadCustomers()}catch(err){show('Save failed: '+err.message,'error')}};document.getElementById('clearBtn').onclick=()=>{form.reset();document.getElementById('balance').value=0;msg.className='msg'};async function loadCustomers(){const key=localStorage.getItem('bizflow_supabase_key');if(!key){status.textContent='Save the connection key above first.';return}status.textContent='Loading customers...';try{const r=await fetch(URL+'/rest/v1/customers?select=*&order=created_at.desc',{headers:{apikey:key,Authorization:'Bearer '+key}});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.hint||'Unable to load customers');customers=Array.isArray(d)?d:[];status.textContent=customers.length+' customer(s)';render()}catch(e){status.textContent='Load failed: '+e.message;list.innerHTML=''}}function render(){const q=search.value.trim().toLowerCase();const rows=customers.filter(c=>(c.name||'').toLowerCase().includes(q)||(c.mobile||'').toLowerCase().includes(q));list.innerHTML=rows.length?rows.map(c=>'<div class="customer"><div class="cname">'+esc(c.name)+'</div><div class="line">📱 '+esc(c.mobile||'-')+'</div><div class="line">📍 '+esc(c.address||'-')+'</div><div class="balance">Opening Balance: ₹'+Number(c.opening_balance||0).toFixed(2)+'</div></div>').join(''):'<div class="empty">No customers found.</div>'}search.oninput=render;document.getElementById('reload').onclick=loadCustomers;loadCustomers();</script></body></html>
