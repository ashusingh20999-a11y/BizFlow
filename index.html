<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>BizFlow - Customer Entry</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;font-family:Inter,Arial,sans-serif;background:#f4f7fb;color:#172033;min-height:100vh}
    .topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}
    .brand{font-size:25px;font-weight:800;letter-spacing:.3px}.subtitle{margin-top:5px;opacity:.9;font-size:14px}
    .wrap{max-width:560px;margin:-18px auto 0;padding:0 14px 28px}
    .card{background:#fff;border-radius:20px;padding:22px 18px;box-shadow:0 8px 28px rgba(31,41,55,.10)}
    h1{font-size:21px;margin:0 0 20px}.field{margin-bottom:16px}
    label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}
    input,textarea{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff;transition:.2s}
    input:focus,textarea:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.10)}
    textarea{min-height:90px;resize:vertical}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}
    button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}
    .msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}
    .note{margin-top:15px;text-align:center;font-size:12px;color:#64748b}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Simple business management</div></header>
  <main class="wrap">
    <section class="card">
      <h1>Customer Entry</h1>
      <form id="customerForm" novalidate>
        <div class="field"><label for="name">Customer Name *</label><input id="name" name="name" type="text" placeholder="Enter customer name" autocomplete="name" required></div>
        <div class="field"><label for="mobile">Mobile Number</label><input id="mobile" name="mobile" type="tel" inputmode="numeric" placeholder="Enter mobile number" maxlength="15" autocomplete="tel"></div>
        <div class="field"><label for="address">Address</label><textarea id="address" name="address" placeholder="Enter customer address"></textarea></div>
        <div class="field"><label for="balance">Opening Balance</label><input id="balance" name="balance" type="number" inputmode="decimal" min="0" step="0.01" value="0" placeholder="0.00"></div>
        <div class="actions"><button class="save" type="submit">SAVE CUSTOMER</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div>
        <div id="msg" class="msg"></div>
      </form>
      <div class="note">Cloud save will be connected to Supabase in the next step.</div>
    </section>
  </main>
  <script>
    const form=document.getElementById('customerForm'), msg=document.getElementById('msg'), clearBtn=document.getElementById('clearBtn');
    form.addEventListener('submit',e=>{e.preventDefault(); const name=document.getElementById('name').value.trim(); if(!name){show('Please enter customer name.','error');document.getElementById('name').focus();return;} show('Form is working. Supabase save will be connected next.','success');});
    clearBtn.addEventListener('click',()=>{form.reset();document.getElementById('balance').value='0';msg.className='msg';msg.textContent='';document.getElementById('name').focus();});
    function show(text,type){msg.textContent=text;msg.className='msg show '+type;}
  </script>
</body>
</html>
