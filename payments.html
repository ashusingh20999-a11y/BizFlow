<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Payment Entry</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#059669,#0f766e);color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}.wrap{max-width:650px;margin:-15px auto;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0001}h1{margin:0 0 18px;font-size:22px}.field{margin-bottom:15px}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:#475569}input,select,textarea{width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px;box-sizing:border-box}textarea{min-height:90px;resize:vertical}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:18px}button{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px}.save{background:#059669;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-weight:700}.show{display:block}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b91c1c}.back{display:block;text-align:center;margin-top:16px;color:#059669;font-weight:700;text-decoration:none}</style></head><body><header class="top"><b style="font-size:25px">BIZFLOW</b><div>Payment Management</div></header><main class="wrap"><section class="card"><h1>Payment Entry</h1><form id="f"><div class="field"><label>Customer *</label><select id="customer_id" required><option value="">Loading customers...</option></select></div><div class="field"><label>Sale / Invoice</label><select id="sale_id"><option value="">Optional - select invoice</option></select></div><div class="grid"><div class="field"><label>Amount *</label><input id="amount" type="number" min="0.01" step="0.01" required></div><div class="field"><label>Payment Date</label><input id="payment_date" type="date"></div></div><div class="field"><label>Payment Method</label><select id="payment_method"><option>Cash</option><option>UPI</option><option>Bank Transfer</option><option>Card</option><option>Cheque</option></select></div><div class="field"><label>Notes</label><textarea id="notes" placeholder="Optional notes"></textarea></div><div class="buttons"><button class="save">SAVE PAYMENT</button><button class="clear" type="button" id="clear">CLEAR</button></div><div id="msg" class="msg"></div></form><a class="back" href="sales.html">← Back to Sales</a></section></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',K=()=>localStorage.getItem('bizflow_supabase_key'),q=id=>document.getElementById(id),msg=(t,c)=>{q('msg').textContent=t;q('msg').className='msg show '+c};q('payment_date').value=new Date().toISOString().slice(0,10);async function load(){let k=K();if(!k)return msg('Save connection key from Sales Entry first.','err');try{let [a,b]=await Promise.all([fetch(U+'/rest/v1/customers?select=id,name&order=name',{headers:{apikey:k,Authorization:'Bearer '+k}}),fetch(U+'/rest/v1/sales?select=id,invoice_no,customer_id&order=id.desc',{headers:{apikey:k,Authorization:'Bearer '+k}})]);let cd=await a.json(),sd=await b.json();if(!a.ok)throw Error(cd.message||'Customers load failed');if(!b.ok)throw Error(sd.message||'Sales load failed');q('customer_id').innerHTML='<option value="">Select customer</option>'+cd.map(x=>`<option value="${x.id}">${x.name}</option>`).join('');q('sale_id').innerHTML='<option value="">Optional - select invoice</option>'+sd.map(x=>`<option value="${x.id}" data-customer="${x.customer_id||''}">${x.invoice_no}</option>`).join('')}catch(e){msg(e.message,'err')}}q('sale_id').onchange=()=>{let o=q('sale_id').selectedOptions[0];if(o?.dataset.customer)q('customer_id').value=o.dataset.customer};q('clear').onclick=()=>{q('f').reset();q('payment_date').value=new Date().toISOString().slice(0,10);q('msg').className='msg'};q('f').onsubmit=async e=>{e.preventDefault();let k=K();if(!k)return msg('Save connection key first.','err');let body={customer_id:Number(q('customer_id').value),sale_id:q('sale_id').value?Number(q('sale_id').value):null,amount:Number(q('amount').value),payment_date:q('payment_date').value,payment_method:q('payment_method').value,notes:q('notes').value.trim()};try{let r=await fetch(U+'/rest/v1/payments',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');msg('Payment saved successfully in cloud.','ok');q('f').reset();q('payment_date').value=new Date().toISOString().slice(0,10);load()}catch(e){msg('Save failed: '+e.message,'err')}};load();</script></body></html>
