<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Sale Items</title><style>body{margin:0;font-family:Arial;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:24px 18px;border-radius:0 0 24px 24px}.wrap{max-width:650px;margin:-15px auto;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0001}h1{margin:0 0 18px;font-size:22px}.field{margin-bottom:15px}label{display:block;font-weight:700;font-size:13px;margin-bottom:7px;color:#475569}input,select{width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px;box-sizing:border-box}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.amount{background:#eef4ff;padding:16px;border-radius:14px;font-size:22px;font-weight:800;text-align:right;margin:8px 0 18px}.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;padding:14px;font-weight:800;font-size:15px}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:14px;padding:12px;border-radius:10px;font-weight:700}.show{display:block}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b91c1c}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;font-weight:700;text-decoration:none}</style></head><body><header class="top"><b style="font-size:25px">BIZFLOW</b><div>Sale Item Entry</div></header><main class="wrap"><section class="card"><h1>Sale Item</h1><form id="f"><div class="field"><label>Sale *</label><select id="sale_id" required><option value="">Loading sales...</option></select></div><div class="field"><label>Product *</label><select id="product_id" required><option value="">Loading products...</option></select></div><div class="grid"><div class="field"><label>Quantity *</label><input id="quantity" type="number" min="0.01" step="0.01" value="1" required></div><div class="field"><label>Price *</label><input id="price" type="number" min="0" step="0.01" value="0" required></div></div><div class="amount">₹ <span id="amount">0.00</span></div><div class="buttons"><button class="save">SAVE ITEM</button><button class="clear" type="button" id="clear">CLEAR</button></div><div id="msg" class="msg"></div></form><a class="back" href="sales.html">← Back to Sales Entry</a></section></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',K=()=>localStorage.getItem('bizflow_supabase_key'),q=id=>document.getElementById(id),msg=(t,c)=>{q('msg').textContent=t;q('msg').className='msg show '+c};function calc(){q('amount').textContent=(Number(q('quantity').value||0)*Number(q('price').value||0)).toFixed(2)}async function load(){let k=K();if(!k){msg('Supabase connection key not found. Save it from Sales Entry first.','err');return}try{let [a,b]=await Promise.all([fetch(U+'/rest/v1/sales?select=id,invoice_no&order=id.desc',{headers:{apikey:k,Authorization:'Bearer '+k}}),fetch(U+'/rest/v1/products?select=id,name&order=name',{headers:{apikey:k,Authorization:'Bearer '+k}})]);let sd=await a.json(),pd=await b.json();if(!a.ok)throw Error(sd.message||'Sales load failed');if(!b.ok)throw Error(pd.message||'Products load failed');q('sale_id').innerHTML='<option value="">Select sale</option>'+sd.map(x=>`<option value="${x.id}">${x.invoice_no}</option>`).join('');q('product_id').innerHTML='<option value="">Select product</option>'+pd.map(x=>`<option value="${x.id}">${x.name}</option>`).join('')}catch(e){msg(e.message,'err')}}q('quantity').oninput=calc;q('price').oninput=calc;q('clear').onclick=()=>{q('f').reset();q('quantity').value=1;q('price').value=0;calc();q('msg').className='msg'};q('f').onsubmit=async e=>{e.preventDefault();let k=K();if(!k)return msg('Save connection key first.','err');let body={sale_id:Number(q('sale_id').value),product_id:Number(q('product_id').value),quantity:Number(q('quantity').value),price:Number(q('price').value),amount:Number(q('amount').textContent)};try{let r=await fetch(U+'/rest/v1/sale_items',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');msg('Sale item saved successfully.','ok');q('f').reset();q('quantity').value=1;calc();load()}catch(e){msg('Save failed: '+e.message,'err')}};calc();load();</script></body></html>
