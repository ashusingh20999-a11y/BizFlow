<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Customers</title>
<style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 16px 30px;border-radius:0 0 24px 24px}.brand{font-size:24px;font-weight:800}.sub{margin-top:5px;opacity:.9}.wrap{max-width:700px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:18px;box-shadow:0 8px 28px rgba(31,41,55,.1)}.bar{display:flex;gap:10px;align-items:center;margin-bottom:16px}.bar h1{font-size:21px;margin:0;flex:1}input{width:100%;padding:13px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px;margin-bottom:14px}.customer{border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin:10px 0;background:#fafcff}.row{display:flex;justify-content:space-between;gap:10px}.name{font-weight:800;font-size:16px}.muted{font-size:13px;color:#64748b;margin-top:5px}.balance{font-weight:800}.actions{display:flex;gap:8px;margin-top:10px}button,a{border:0;border-radius:10px;padding:10px 13px;font-weight:700;text-decoration:none;cursor:pointer}.back{background:#eef2f7;color:#334155}.delete{background:#fee2e2;color:#b91c1c}.empty{padding:25px;text-align:center;color:#64748b}.msg{display:none;padding:11px;border-radius:10px;margin-bottom:12px;font-weight:700}.show{display:block}.err{background:#fef2f2;color:#b91c1c}.ok{background:#ecfdf3;color:#166534}</style></head>
<body><header class="top"><div class="brand">BIZFLOW</div><div class="sub">Customer Management</div></header><main class="wrap"><section class="card"><div class="bar"><h1>Customers</h1><a class="back" href="index.html">+ Entry</a></div><input id="search" placeholder="Search name or mobile..."><div id="msg" class="msg"></div><div id="list"></div></section></main>
<script>
const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co';let key=localStorage.getItem('bizflow_supabase_key'),customers=[];const list=document.getElementById('list'),search=document.getElementById('search'),msg=document.getElementById('msg');
function show(t,c){msg.textContent=t;msg.className='msg show '+c}
async function load(){if(!key){show('First open Customer Entry and save your Supabase Publishable Key.','err');return}try{let r=await fetch(URL+'/rest/v1/customers?select=id,name,mobile,address,opening_balance,created_at&order=id.desc',{headers:{apikey:key,Authorization:'Bearer '+key}});let d=await r.json();if(!r.ok)throw new Error(d?.message||'Unable to load customers');customers=d;render()}catch(e){show('Load failed: '+e.message,'err')}}
function render(){let q=search.value.trim().toLowerCase();let arr=customers.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.mobile||'').toLowerCase().includes(q));if(!arr.length){list.innerHTML='<div class="empty">No customers found.</div>';return}list.innerHTML=arr.map(x=>`<div class="customer"><div class="row"><div><div class="name">${esc(x.name)}</div><div class="muted">${esc(x.mobile||'No mobile')}</div></div><div class="balance">₹ ${Number(x.opening_balance||0).toFixed(2)}</div></div><div class="muted">${esc(x.address||'No address')}</div><div class="actions"><button class="delete" onclick="del(${x.id})">Delete</button></div></div>`).join('')}
function esc(v){return String(v).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function del(id){if(!confirm('Delete this customer?'))return;try{let r=await fetch(URL+'/rest/v1/customers?id=eq.'+id,{method:'DELETE',headers:{apikey:key,Authorization:'Bearer '+key}});if(!r.ok){let d=await r.json().catch(()=>null);throw new Error(d?.message||'Delete failed')}show('Customer deleted.','ok');await load()}catch(e){show('Delete failed: '+e.message,'err')}}
search.oninput=render;load();
</script></body></html>
