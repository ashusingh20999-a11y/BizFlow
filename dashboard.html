<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow Dashboard</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:25px 18px 38px;border-radius:0 0 28px 28px}.brand{font-size:27px;font-weight:800}.sub{margin-top:5px;opacity:.9}.wrap{max-width:850px;margin:-22px auto;padding:0 14px 35px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.card{background:#fff;border-radius:18px;padding:18px;box-shadow:0 6px 24px #0001}.label{font-size:13px;color:#64748b;font-weight:700}.value{font-size:25px;font-weight:800;margin-top:7px}.section{margin-top:18px}.section h2{font-size:18px}.links{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.links a{background:#fff;padding:16px;border-radius:15px;text-decoration:none;color:#172033;font-weight:800;box-shadow:0 4px 15px #0001}.msg{margin-top:14px;background:#eef4ff;padding:12px;border-radius:10px;font-size:13px;color:#334155}@media(min-width:700px){.cards{grid-template-columns:repeat(3,1fr)}.links{grid-template-columns:repeat(3,1fr)}}</style></head><body><header class="top"><div class="brand">BIZFLOW</div><div class="sub">Business Dashboard</div></header><main class="wrap"><div class="cards"><div class="card"><div class="label">TOTAL SALES</div><div class="value" id="sales">₹0.00</div></div><div class="card"><div class="label">TOTAL PAID</div><div class="value" id="paid">₹0.00</div></div><div class="card"><div class="label">TOTAL DUE</div><div class="value" id="due">₹0.00</div></div><div class="card"><div class="label">CUSTOMERS</div><div class="value" id="customers">0</div></div><div class="card"><div class="label">PRODUCTS</div><div class="value" id="products">0</div></div><div class="card"><div class="label">INVOICES</div><div class="value" id="invoices">0</div></div></div><div class="section"><h2>Quick Entry</h2><div class="links"><a href="./">👤 Customer</a><a href="product.html">📦 Product</a><a href="sales.html">🧾 Sale</a><a href="sale-items.html">🛒 Sale Item</a><a href="payments.html">💳 Payment</a></div></div><div id="msg" class="msg">Dashboard data loads from Supabase.</div></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',K=()=>localStorage.getItem('bizflow_supabase_key');async function get(path){let k=K();if(!k)throw Error('Supabase connection key not saved on this device.');let r=await fetch(U+'/rest/v1/'+path,{headers:{apikey:k,Authorization:'Bearer '+k}}),d=await r.json();if(!r.ok)throw Error(d.message||d.hint||'Load failed');return d}async function load(){try{let [s,c,p]=await Promise.all([get('sales?select=total,paid_amount,due_amount'),get('customers?select=id'),get('products?select=id')]);let ts=s.reduce((a,x)=>a+Number(x.total||0),0),tp=s.reduce((a,x)=>a+Number(x.paid_amount||0),0),td=s.reduce((a,x)=>a+Number(x.due_amount||0),0);document.getElementById('sales').textContent='₹'+ts.toFixed(2);document.getElementById('paid').textContent='₹'+tp.toFixed(2);document.getElementById('due').textContent='₹'+td.toFixed(2);document.getElementById('customers').textContent=c.length;document.getElementById('products').textContent=p.length;document.getElementById('invoices').textContent=s.length;document.getElementById('msg').textContent='Live data loaded from Supabase.'}catch(e){document.getElementById('msg').textContent=e.message}}load();</script></body></html>
