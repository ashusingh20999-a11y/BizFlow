<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Sales Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:800}.subtitle{margin-top:5px;opacity:.9;font-size:14px}.wrap{max-width:620px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 28px rgba(31,41,55,.1)}h1{font-size:21px;margin:0 0 8px}.info{background:#eef4ff;padding:12px;border-radius:12px;margin-bottom:18px;font-size:13px;color:#334155}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}input,select{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.totalbox{background:#eef4ff;border-radius:14px;padding:16px;margin:6px 0 16px}.totalrow{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}.grand{font-size:21px;font-weight:800;border-top:1px solid #dbe5f5;margin-top:6px;padding-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Sales Management</div></header><main class="wrap"><section class="card"><h1>Sales Entry</h1><div class="info">Existing <b>sales</b> table schema: customer, invoice, date, subtotal, discount, total, paid, due and payment status.</div><form id="saleForm"><div class="field"><label>Customer *</label><select id="customer_id" required><option value="">Loading customers...</option></select></div><div class="grid"><div class="field"><label>Invoice No *</label><input id="invoice_no" required placeholder="INV-1001"></div><div class="field"><label>Sale Date *</label><input id="sale_date" type="date" required></div></div><div class="grid"><div class="field"><label>Subtotal</label><input id="subtotal" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Discount</label><input id="discount" type="number" min="0" step="0.01" value="0"></div></div><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b>₹<span id="showSubtotal">0.00</span></b></div><div class="totalrow"><span>Discount</span><b>₹<span id="showDiscount">0.00</span></b></div><div class="totalrow grand"><span>Total</span><span>₹<span id="showTotal">0.00</span></span></div></div><div class="grid"><div class="field"><label>Paid Amount</label><input id="paid_amount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Due Amount</label><input id="due_amount" type="number" min="0" step="0.01" value="0" readonly></div></div><div class="field"><label>Payment Status</label><select id="payment_status"><option value="Pending">Pending</option><option value="Partial">Partial</option><option value="Paid">Paid</option></select></div><div class="actions"><button class="save" type="submit">SAVE SALE</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="./">← Back to Customer Entry</a></section></main><script>const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co',form=document.getElementById('saleForm'),msg=document.getElementById('msg'),customer=document.getElementById('customer_id');function key(){return localStorage.getItem('bizflow_supabase_key')}function show(t,c){msg.textContent=t;msg.className='msg show '+c}function calc(){const s=Number(document.getElementById('subtotal').value||0),d=Number(document.getElementById('discount').value||0),p=Number(document.getElementById('paid_amount').value||0),t=Math.max(0,s-d),due=Math.max(0,t-p);document.getElementById('showSubtotal').textContent=s.toFixed(2);document.getElementById('showDiscount').textContent=d.toFixed(2);document.getElementById('showTotal').textContent=t.toFixed(2);document.getElementById('due_amount').value=due.toFixed(2);const st=document.getElementById('payment_status');if(p<=0)st.value='Pending';else if(p>=t)st.value='Paid';else st.value='Partial'}document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);document.getElementById('setKey').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','error');localStorage.setItem('bizflow_supabase_key',k);document.getElementById('key').value='';show('Connection key saved.','success');loadCustomers()};async function loadCustomers(){const k=key();if(!k){customer.innerHTML='<option value="">Save connection key first</option>';return}try{const r=await fetch(URL+'/rest/v1/customers?select=id,name&order=name',{headers:{apikey:k,Authorization:'Bearer '+k}}),d=await r.json();if(!r.ok)throw Error(d.message||d.hint||'Customer load failed');customer.innerHTML='<option value="">Select customer</option>'+d.map(x=>'<option value="'+x.id+'">'+String(x.name).replace(/[&<>"\']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))+'</option>').join('')}catch(e){show(e.message,'error')}}[document.getElementById('subtotal'),document.getElementById('discount'),document.getElementById('paid_amount')].forEach(x=>x.addEventListener('input',calc));form.onsubmit=async e=>{e.preventDefault();const k=key();if(!k)return show('Save the connection key first.','error');calc();const body={customer_id:customer.value,invoice_no:document.getElementById('invoice_no').value.trim(),sale_date:document.getElementById('sale_date').value,subtotal:Number(document.getElementById('subtotal').value||0),discount:Number(document.getElementById('discount').value||0),total:Number(document.getElementById('showTotal').textContent||0),paid_amount:Number(document.getElementById('paid_amount').value||0),due_amount:Number(document.getElementById('due_amount').value||0),payment_status:document.getElementById('payment_status').value};try{const r=await fetch(URL+'/rest/v1/sales',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');show('Sale saved successfully in cloud.','success');form.reset();document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);calc();loadCustomers()}catch(e){show('Save failed: '+e.message,'error')}};document.getElementById('clearBtn').onclick=()=>{form.reset();document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);calc();msg.className='msg'};calc();loadCustomers();</script></body></html>
