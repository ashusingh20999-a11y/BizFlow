<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Sales Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:800}.subtitle{margin-top:5px;opacity:.9;font-size:14px}.wrap{max-width:620px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 28px rgba(31,41,55,.1)}h1{font-size:21px;margin:0 0 20px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}input,select{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff}.total{background:#eef4ff;border-radius:12px;padding:15px;font-size:20px;font-weight:800;margin:18px 0}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Sales Management</div></header><main class="wrap"><section class="card"><h1>Sales Entry</h1><form id="saleForm"><div class="field"><label>Customer *</label><select id="customer_id" required><option value="">Loading customers...</option></select></div><div class="field"><label>Product *</label><select id="product_id" required><option value="">Loading products...</option></select></div><div class="field"><label>Quantity *</label><input id="quantity" type="number" min="0.01" step="0.01" value="1" required></div><div class="field"><label>Sale Rate</label><input id="rate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Discount</label><input id="discount" type="number" min="0" step="0.01" value="0"></div><div class="total">Total: ₹<span id="total">0.00</span></div><div class="field"><label>Payment Type</label><select id="payment_type"><option value="CASH">Cash</option><option value="UPI">UPI</option><option value="CREDIT">Credit</option></select></div><div class="actions"><button class="save" type="submit">SAVE SALE</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="./">← Back to Customer Entry</a></section></main><script>const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co',keyInput=document.getElementById('key'),form=document.getElementById('saleForm'),msg=document.getElementById('msg'),customer=document.getElementById('customer_id'),product=document.getElementById('product_id'),rate=document.getElementById('rate'),qty=document.getElementById('quantity'),discount=document.getElementById('discount');function key(){return localStorage.getItem('bizflow_supabase_key')}function show(t,c){msg.textContent=t;msg.className='msg show '+c}function total(){document.getElementById('total').textContent=Math.max(0,(Number(qty.value)||0)*(Number(rate.value)||0)-(Number(discount.value)||0)).toFixed(2)}document.getElementById('setKey').onclick=()=>{const k=keyInput.value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','error');localStorage.setItem('bizflow_supabase_key',k);keyInput.value='';show('Connection key saved.','success');loadData()};async function loadData(){const k=key();if(!k){show('First save the connection key below.','error');return}try{let r=await fetch(URL+'/rest/v1/customers?select=id,name&order=name',{headers:{apikey:k,Authorization:'Bearer '+k}});let d=await r.json();if(!r.ok)throw Error(d.message||'Customer load failed');customer.innerHTML='<option value="">Select customer</option>'+d.map(x=>`<option value="${x.id}">${String(x.name).replaceAll('"','&quot;')}</option>`).join('');r=await fetch(URL+'/rest/v1/products?select=id,product_name,sale_rate&order=product_name',{headers:{apikey:k,Authorization:'Bearer '+k}});d=await r.json();if(!r.ok)throw Error(d.message||'Product load failed');product.innerHTML='<option value="">Select product</option>'+d.map(x=>`<option value="${x.id}" data-rate="${x.sale_rate||0}">${String(x.product_name).replaceAll('"','&quot;')}</option>`).join('')}catch(e){show(e.message,'error')}}product.onchange=()=>{const o=product.options[product.selectedIndex];if(o&&o.dataset.rate)rate.value=o.dataset.rate;total()};[qty,rate,discount].forEach(x=>x.oninput=total);form.onsubmit=async e=>{e.preventDefault();const k=key();if(!k)return show('Save the connection key first.','error');const body={customer_id:customer.value,product_id:product.value,quantity:Number(qty.value),rate:Number(rate.value),discount:Number(discount.value||0),total_amount:Number(document.getElementById('total').textContent),payment_type:document.getElementById('payment_type').value};try{const r=await fetch(URL+'/rest/v1/sales',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');show('Sale saved successfully in cloud.','success');form.reset();rate.value=0;qty.value=1;discount.value=0;total()}catch(e){show('Save failed: '+e.message,'error')}};document.getElementById('clearBtn').onclick=()=>{form.reset();qty.value=1;rate.value=0;discount.value=0;total();msg.className='msg'};loadData();</script></body></html>
