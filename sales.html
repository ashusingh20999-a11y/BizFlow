<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Sales Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:800}.subtitle{margin-top:5px;opacity:.9;font-size:14px}.wrap{max-width:650px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 28px rgba(31,41,55,.1)}h1{font-size:21px;margin:0 0 8px}.info{background:#eef4ff;padding:12px;border-radius:12px;margin-bottom:18px;font-size:13px;color:#334155}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}input,select,textarea{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.section{border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin:16px 0}.section-title{font-size:15px;font-weight:800;margin-bottom:14px}.totalbox{background:#eef4ff;border-radius:14px;padding:16px;margin:6px 0 16px}.totalrow{display:flex;justify-content:space-between;padding:5px 0;font-size:15px}.grand{font-size:21px;font-weight:800;border-top:1px solid #dbe5f5;margin-top:6px;padding-top:10px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}.hint{font-size:12px;color:#64748b;margin-top:-8px;margin-bottom:12px}</style></head><body><header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Sales & Payment Entry</div></header><main class="wrap"><section class="card"><h1>Sales Entry</h1><div class="info">Uses your existing <b>sales</b>, <b>sale_items</b> and <b>payments</b> tables.</div><form id="saleForm"><div class="field"><label>Customer *</label><select id="customer_id" required><option value="">Loading customers...</option></select></div><div class="grid"><div class="field"><label>Invoice No *</label><input id="invoice_no" required placeholder="INV-1001"></div><div class="field"><label>Sale Date *</label><input id="sale_date" type="date" required></div></div><div class="section"><div class="section-title">Product Details</div><div class="field"><label>Product *</label><select id="product_id" required><option value="">Loading products...</option></select></div><div class="grid"><div class="field"><label>Quantity *</label><input id="quantity" type="number" min="0.01" step="0.01" value="1" required></div><div class="field"><label>Price</label><input id="price" type="number" min="0" step="0.01" value="0"></div></div><div class="hint">Amount = Quantity × Price</div><div class="totalrow"><span>Item Amount</span><b>₹<span id="itemAmount">0.00</span></b></div></div><div class="grid"><div class="field"><label>Subtotal</label><input id="subtotal" type="number" min="0" step="0.01" value="0" readonly></div><div class="field"><label>Discount</label><input id="discount" type="number" min="0" step="0.01" value="0"></div></div><div class="totalbox"><div class="totalrow"><span>Subtotal</span><b>₹<span id="showSubtotal">0.00</span></b></div><div class="totalrow"><span>Discount</span><b>₹<span id="showDiscount">0.00</span></b></div><div class="totalrow grand"><span>Total</span><span>₹<span id="showTotal">0.00</span></span></div></div><div class="grid"><div class="field"><label>Paid Amount</label><input id="paid_amount" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Due Amount</label><input id="due_amount" type="number" min="0" step="0.01" value="0" readonly></div></div><div class="grid"><div class="field"><label>Payment Method</label><select id="payment_method"><option value="Cash">Cash</option><option value="UPI">UPI</option><option value="Card">Card</option><option value="Bank Transfer">Bank Transfer</option></select></div><div class="field"><label>Payment Status</label><select id="payment_status"><option value="Pending">Pending</option><option value="Partial">Partial</option><option value="Paid">Paid</option></select></div></div><div class="field"><label>Payment Notes</label><textarea id="notes" rows="2" placeholder="Optional"></textarea></div><div class="actions"><button class="save" type="submit" id="saveBtn">SAVE SALE</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="./">← Back to Customer Entry</a></section></main><script>const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co',form=document.getElementById('saleForm'),msg=document.getElementById('msg'),customer=document.getElementById('customer_id'),product=document.getElementById('product_id'),qty=document.getElementById('quantity'),price=document.getElementById('price'),subtotal=document.getElementById('subtotal'),discount=document.getElementById('discount'),paid=document.getElementById('paid_amount'),due=document.getElementById('due_amount'),status=document.getElementById('payment_status');function key(){return localStorage.getItem('bizflow_supabase_key')}function show(t,c){msg.textContent=t;msg.className='msg show '+c}function calc(){const q=Number(qty.value||0),p=Number(price.value||0),a=q*p,d=Number(discount.value||0),t=Math.max(0,a-d),pa=Number(paid.value||0),du=Math.max(0,t-pa);document.getElementById('itemAmount').textContent=a.toFixed(2);subtotal.value=a.toFixed(2);document.getElementById('showSubtotal').textContent=a.toFixed(2);document.getElementById('showDiscount').textContent=d.toFixed(2);document.getElementById('showTotal').textContent=t.toFixed(2);due.value=du.toFixed(2);status.value=pa<=0?'Pending':pa>=t?'Paid':'Partial'}function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);document.getElementById('setKey').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','error');localStorage.setItem('bizflow_supabase_key',k);document.getElementById('key').value='';show('Connection key saved.','success');loadData()};async function get(path,opts={}){const k=key();const r=await fetch(URL+path,{...opts,headers:{apikey:k,Authorization:'Bearer '+k,...(opts.headers||{})}});const d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Request failed');return d}async function loadData(){const k=key();if(!k){customer.innerHTML='<option value="">Save connection key first</option>';product.innerHTML='<option value="">Save connection key first</option>';return}try{let d=await get('/rest/v1/customers?select=id,name&order=name');customer.innerHTML='<option value="">Select customer</option>'+d.map(x=>'<option value="'+x.id+'">'+esc(x.name)+'</option>').join('');d=await get('/rest/v1/products?select=id,product_name,sale_rate&order=product_name');product.innerHTML='<option value="">Select product</option>'+d.map(x=>'<option value="'+x.id+'" data-rate="'+(x.sale_rate||0)+'">'+esc(x.product_name)+'</option>').join('')}catch(e){show(e.message,'error')}}product.onchange=()=>{const o=product.options[product.selectedIndex];price.value=o?.dataset.rate||0;calc()};[qty,price,discount,paid].forEach(x=>x.addEventListener('input',calc));form.onsubmit=async e=>{e.preventDefault();const k=key();if(!k)return show('Save the connection key first.','error');calc();const saveBtn=document.getElementById('saveBtn');saveBtn.disabled=true;try{const total=Number(document.getElementById('showTotal').textContent),pay=Number(paid.value||0);const saleBody={customer_id:customer.value,invoice_no:document.getElementById('invoice_no').value.trim(),sale_date:document.getElementById('sale_date').value,subtotal:Number(subtotal.value||0),discount:Number(discount.value||0),total,paid_amount:pay,due_amount:Number(due.value||0),payment_status:status.value};const sale=await get('/rest/v1/sales?select=id',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=representation'},body:JSON.stringify(saleBody)});const saleId=sale[0].id;const itemBody={sale_id:saleId,product_id:product.value,quantity:Number(qty.value),price:Number(price.value||0),amount:Number(document.getElementById('itemAmount').textContent||0)};await get('/rest/v1/sale_items',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(itemBody)});if(pay>0){const paymentBody={customer_id:customer.value,sale_id:saleId,amount:pay,payment_date:document.getElementById('sale_date').value,payment_method:document.getElementById('payment_method').value,notes:document.getElementById('notes').value.trim()};await get('/rest/v1/payments',{method:'POST',headers:{'Content-Type':'application/json',Prefer:'return=minimal'},body:JSON.stringify(paymentBody)})}show('Sale, item and payment saved successfully in cloud.','success');form.reset();document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);qty.value=1;price.value=0;discount.value=0;paid.value=0;calc();loadData()}catch(e){show('Save failed: '+e.message,'error')}finally{saveBtn.disabled=false}};document.getElementById('clearBtn').onclick=()=>{form.reset();document.getElementById('sale_date').value=new Date().toISOString().slice(0,10);qty.value=1;price.value=0;discount.value=0;paid.value=0;calc();msg.className='msg'};calc();loadData();</script></body></html>
