<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Product Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:24px 18px 34px;border-radius:0 0 24px 24px}.brand{font-size:26px;font-weight:800}.sub{margin-top:5px;opacity:.9}.wrap{max-width:620px;margin:-18px auto 30px;padding:0 14px}.card{background:#fff;border-radius:20px;padding:20px;box-shadow:0 8px 28px #0001}h1{margin:0 0 20px;font-size:22px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;color:#475569;margin-bottom:7px}input{width:100%;padding:14px;border:1px solid #dbe2ea;border-radius:12px;font-size:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-weight:700}.show{display:block}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><header class="top"><div class="brand">BIZFLOW</div><div class="sub">Product Management</div></header><main class="wrap"><section class="card"><h1>Product Entry</h1><form id="f"><div class="field"><label>Product Name *</label><input id="name" required placeholder="Enter product name"></div><div class="field"><label>SKU</label><input id="sku" placeholder="Enter SKU"></div><div class="grid"><div class="field"><label>Price</label><input id="price" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Stock</label><input id="stock" type="number" min="0" step="0.01" value="0"></div></div><div class="actions"><button class="save" type="submit">SAVE PRODUCT</button><button class="clear" type="button" id="clear">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the same Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="dashboard.html">← Back to Dashboard</a></section></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',q=x=>document.getElementById(x),K=()=>localStorage.getItem('bizflow_supabase_key');function show(t,c){q('msg').textContent=t;q('msg').className='msg show '+c}q('setKey').onclick=()=>{let k=q('key').value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','err');localStorage.setItem('bizflow_supabase_key',k);q('key').value='';show('Connection key saved.','ok')};q('f').onsubmit=async e=>{e.preventDefault();let k=K();if(!k)return show('Save the connection key first.','err');let body={name:q('name').value.trim(),sku:q('sku').value.trim()||null,price:Number(q('price').value||0),stock:Number(q('stock').value||0)};try{let r=await fetch(U+'/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');show('Product saved successfully in cloud.','ok');q('f').reset();q('price').value=0;q('stock').value=0}catch(e){show('Save failed: '+e.message,'err')}};q('clear').onclick=()=>{q('f').reset();q('price').value=0;q('stock').value=0;q('msg').className='msg'};</script></body></html>
