<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Product Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.topbar{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:22px 18px 30px;border-radius:0 0 24px 24px}.brand{font-size:25px;font-weight:800}.subtitle{margin-top:5px;opacity:.9;font-size:14px}.wrap{max-width:620px;margin:-18px auto 0;padding:0 14px 30px}.card{background:#fff;border-radius:20px;padding:20px 18px;box-shadow:0 8px 28px rgba(31,41,55,.1)}h1{font-size:21px;margin:0 0 20px}.field{margin-bottom:16px}label{display:block;font-size:13px;font-weight:700;margin-bottom:7px;color:#475569}input,select{width:100%;border:1px solid #dbe2ea;border-radius:12px;padding:13px 14px;font-size:16px;outline:none;background:#fbfdff}.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}button{border:0;border-radius:12px;padding:14px;font-size:15px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:15px;padding:12px;border-radius:10px;font-size:14px;font-weight:700}.msg.show{display:block}.success{background:#ecfdf3;color:#166534}.error{background:#fef2f2;color:#b91c1c}.config{margin-top:18px;padding:14px;background:#f8fafc;border-radius:12px}.config input{font-size:12px}.config button{width:100%;margin-top:8px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:16px;color:#2563eb;text-decoration:none;font-weight:700}</style></head><body><header class="topbar"><div class="brand">BIZFLOW</div><div class="subtitle">Product Management</div></header><main class="wrap"><section class="card"><h1>Product Entry</h1><form id="productForm"><div class="field"><label>Product Name *</label><input id="product_name" required placeholder="Enter product name"></div><div class="field"><label>Product Code</label><input id="product_code" placeholder="Enter product code"></div><div class="field"><label>Purchase Rate</label><input id="purchase_rate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Sale Rate</label><input id="sale_rate" type="number" min="0" step="0.01" value="0"></div><div class="field"><label>Unit</label><select id="unit"><option value="PCS">PCS</option><option value="KG">KG</option><option value="BOX">BOX</option><option value="LTR">LTR</option><option value="OTHER">OTHER</option></select></div><div style="font-size:12px;color:#64748b;background:#f8fafc;padding:10px;border-radius:10px">Opening Stock field removed because the existing <b>products</b> table does not have an <b>opening_stock</b> column.</div><div class="actions"><button class="save" type="submit">SAVE PRODUCT</button><button class="clear" type="button" id="clearBtn">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the same Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="./">← Back to Customer Entry</a></section></main><script>const URL='https://bbdoxtqdtaqzcdcyanfw.supabase.co';const form=document.getElementById('productForm'),msg=document.getElementById('msg');function show(t,c){msg.textContent=t;msg.className='msg show '+c}const existing=localStorage.getItem('bizflow_supabase_key');if(existing)document.getElementById('key').placeholder='Key already saved on this device';document.getElementById('setKey').onclick=()=>{const k=document.getElementById('key').value.trim();if(!k.startsWith('sb_publishable_')){show('Enter the Supabase Publishable Key.','error');return}localStorage.setItem('bizflow_supabase_key',k);document.getElementById('key').value='';show('Connection key saved on this device.','success')};form.onsubmit=async e=>{e.preventDefault();const key=localStorage.getItem('bizflow_supabase_key');if(!key){show('First save the Supabase Publishable Key below.','error');return}const product_name=document.getElementById('product_name').value.trim();if(!product_name){show('Please enter product name.','error');return}const body={product_name,product_code:document.getElementById('product_code').value.trim(),purchase_rate:Number(document.getElementById('purchase_rate').value||0),sale_rate:Number(document.getElementById('sale_rate').value||0),unit:document.getElementById('unit').value};try{const r=await fetch(URL+'/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json','apikey':key,'Authorization':'Bearer '+key,'Prefer':'return=minimal'},body:JSON.stringify(body)});const d=await r.json().catch(()=>null);if(!r.ok)throw new Error(d?.message||d?.hint||'Save failed');show('Product saved successfully in cloud.','success');form.reset();document.getElementById('purchase_rate').value=0;document.getElementById('sale_rate').value=0}catch(err){show('Save failed: '+err.message,'error')}};document.getElementById('clearBtn').onclick=()=>{form.reset();document.getElementById('purchase_rate').value=0;document.getElementById('sale_rate').value=0;msg.className='msg'};</script></body></html>
