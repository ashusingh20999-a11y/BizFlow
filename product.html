<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Product Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f7fb;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:26px 18px 42px;border-radius:0 0 28px 28px}.brand{font-size:27px;font-weight:800}.sub{margin-top:5px;opacity:.9}.wrap{max-width:650px;margin:-22px auto 30px;padding:0 14px}.card{background:#fff;border-radius:22px;padding:22px 18px;box-shadow:0 8px 30px rgba(15,23,42,.1)}h1{margin:0 0 22px;font-size:23px}.field{margin-bottom:17px}label{display:block;font-size:14px;font-weight:700;color:#475569;margin-bottom:8px}input,select{width:100%;padding:15px;border:1px solid #dbe2ea;border-radius:14px;font-size:17px;background:#fbfdff;outline:none}input:focus,select:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.hint{background:#eef4ff;color:#475569;border-radius:14px;padding:14px;margin:4px 0 18px;font-size:13px;line-height:1.5}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}button{border:0;border-radius:14px;padding:16px;font-size:16px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:16px;padding:13px;border-radius:11px;font-weight:700}.show{display:block}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b91c1c}.config{margin-top:20px;padding:16px;background:#f8fafc;border-radius:15px}.config b{font-size:17px}.config small{display:block;color:#64748b;margin:6px 0 10px}.config input{font-size:13px}.config button{width:100%;margin-top:9px;background:#334155;color:#fff}.back{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none;font-weight:700}@media(max-width:430px){.grid{display:block}.actions{gap:10px}.top{padding-bottom:38px}}</style></head><body><header class="top"><div class="brand">BIZFLOW</div><div class="sub">Product Management</div></header><main class="wrap"><section class="card"><h1>Product Entry</h1><form id="f"><div class="field"><label>Product Name *</label><input id="name" required placeholder="Enter product name"></div><div class="field"><label>SKU / Product Code</label><input id="sku" placeholder="Enter SKU / Product Code"></div><div class="field"><label>Price *</label><input id="price" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Opening Stock</label><input id="stock" type="number" min="0" step="0.01" value="0"></div><div class="hint"><b>Database mapping:</b> Price → <b>price</b> &nbsp;|&nbsp; Opening Stock → <b>stock</b><br>SKU / Product Code → <b>sku</b></div><div class="actions"><button class="save" type="submit">SAVE PRODUCT</button><button class="clear" type="button" id="clear">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><small>Use the same Publishable Key saved on this device.</small><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="dashboard.html">← Back to Dashboard</a></section></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',q=x=>document.getElementById(x),K=()=>localStorage.getItem('bizflow_supabase_key');function show(t,c){q('msg').textContent=t;q('msg').className='msg show '+c}q('setKey').onclick=()=>{let k=q('key').value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','err');localStorage.setItem('bizflow_supabase_key',k);q('key').value='';show('Connection key saved.','ok')};q('f').onsubmit=async e=>{e.preventDefault();let k=K();if(!k)return show('Save the connection key first.','err');let body={name:q('name').value.trim(),sku:q('sku').value.trim()||null,price:Number(q('price').value||0),stock:Number(q('stock').value||0)};try{let r=await fetch(U+'/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');show('Product saved successfully in cloud.','ok');q('f').reset();q('price').value=0;q('stock').value=0}catch(e){show('Save failed: '+e.message,'err')}};q('clear').onclick=()=>{q('f').reset();q('price').value=0;q('stock').value=0;q('msg').className='msg'};</script></body></html>
