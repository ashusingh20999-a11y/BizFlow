<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BizFlow - Product Entry</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#eef3f9;color:#172033}.top{background:linear-gradient(135deg,#2563eb,#4f46e5);color:#fff;padding:25px 18px 44px;border-radius:0 0 28px 28px}.brand{font-size:27px;font-weight:800}.sub{margin-top:5px;opacity:.9}.wrap{max-width:650px;margin:-25px auto 30px;padding:0 14px}.card{background:#fff;border-radius:24px;padding:22px 18px;box-shadow:0 10px 32px rgba(15,23,42,.12)}h1{font-size:23px;margin:0 0 22px}.field{margin-bottom:18px}label{display:block;font-size:15px;font-weight:700;color:#475569;margin-bottom:8px}input{width:100%;height:60px;padding:0 16px;border:1px solid #d9e1eb;border-radius:17px;font-size:18px;background:#fff;outline:none}input:focus{border-color:#2563eb;box-shadow:0 0 0 3px #2563eb18}.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.stockbox{background:#eef4ff;border-radius:17px;padding:16px;margin:3px 0 20px}.stockbox b{font-size:14px;color:#475569}.stockbox div{font-size:12px;color:#64748b;margin-top:5px;line-height:1.4}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions button{height:62px;border:0;border-radius:17px;font-size:16px;font-weight:800}.save{background:#2563eb;color:#fff}.clear{background:#eef2f7;color:#334155}.msg{display:none;margin-top:16px;padding:14px;border-radius:13px;font-weight:700}.show{display:block}.ok{background:#ecfdf3;color:#166534}.err{background:#fef2f2;color:#b91c1c}.config{margin-top:20px;background:#f8fafc;border-radius:17px;padding:16px}.config input{height:52px;font-size:13px;margin-top:9px}.config button{width:100%;height:54px;margin-top:9px;border:0;border-radius:14px;background:#334155;color:#fff;font-weight:800}.back{display:block;text-align:center;margin-top:18px;color:#2563eb;text-decoration:none;font-weight:700}@media(max-width:430px){.grid{display:block}}</style></head><body><header class="top"><div class="brand">BIZFLOW</div><div class="sub">Product Management</div></header><main class="wrap"><section class="card"><h1>Product Entry</h1><form id="f"><div class="field"><label>Product Name *</label><input id="name" required placeholder="Enter product name"></div><div class="field"><label>SKU / Product Code</label><input id="sku" placeholder="Enter SKU / Product Code"></div><div class="grid"><div class="field"><label>Price *</label><input id="price" type="number" min="0" step="0.01" value="0" required></div><div class="field"><label>Opening Stock</label><input id="stock" type="number" min="0" step="0.01" value="0"></div></div><div class="stockbox"><b>Stock Information</b><div>Opening Stock is saved in the existing <b>stock</b> column. Price is saved in <b>price</b>.</div></div><div class="actions"><button class="save" type="submit">SAVE PRODUCT</button><button class="clear" type="button" id="clear">CLEAR</button></div><div id="msg" class="msg"></div></form><div class="config"><b>Supabase connection</b><div style="font-size:12px;color:#64748b;margin:6px 0">Use the same Publishable Key saved on this device.</div><input id="key" type="password" placeholder="sb_publishable_..."><button type="button" id="setKey">SAVE CONNECTION KEY</button></div><a class="back" href="dashboard.html">← Back to Dashboard</a></section></main><script>const U='https://bbdoxtqdtaqzcdcyanfw.supabase.co',q=x=>document.getElementById(x),K=()=>localStorage.getItem('bizflow_supabase_key');function show(t,c){q('msg').textContent=t;q('msg').className='msg show '+c}q('setKey').onclick=()=>{let k=q('key').value.trim();if(!k.startsWith('sb_publishable_'))return show('Enter the Supabase Publishable Key.','err');localStorage.setItem('bizflow_supabase_key',k);q('key').value='';show('Connection key saved.','ok')};q('f').onsubmit=async e=>{e.preventDefault();let k=K();if(!k)return show('Save the connection key first.','err');let body={name:q('name').value.trim(),sku:q('sku').value.trim()||null,price:Number(q('price').value||0),stock:Number(q('stock').value||0)};try{let r=await fetch(U+'/rest/v1/products',{method:'POST',headers:{'Content-Type':'application/json',apikey:k,Authorization:'Bearer '+k,Prefer:'return=minimal'},body:JSON.stringify(body)}),d=await r.json().catch(()=>null);if(!r.ok)throw Error(d?.message||d?.hint||'Save failed');show('Product saved successfully in cloud.','ok');q('f').reset();q('price').value=0;q('stock').value=0}catch(e){show('Save failed: '+e.message,'err')}};q('clear').onclick=()=>{q('f').reset();q('price').value=0;q('stock').value=0;q('msg').className='msg'};</script></body></html>
